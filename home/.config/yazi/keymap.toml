#:schema https://yazi-rs.github.io/schemas/keymap.json

[[mgr.prepend_keymap]]
on = "d"
run = "remove"
desc = "Move selected files to trash"

[[mgr.prepend_keymap]]
on = "D"
run = "remove --permanently"
desc = "Permanently delete selected files"

[[mgr.prepend_keymap]]
on = "l"
run = "plugin smart-enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on = "."
run = "hidden toggle"
desc = "Toggle hidden files"

[[mgr.prepend_keymap]]
on = [ "g", "h" ]
run = "cd ~"
desc = "Go home"

[[mgr.prepend_keymap]]
on = [ "g", "d" ]
run = "cd ~/Descargas"
desc = "Go downloads"

[[mgr.prepend_keymap]]
on = [ "g", "c" ]
run = "cd ~/.config"
desc = "Go config"

[[mgr.prepend_keymap]]
on = [ "g", "p" ]
run = "cd ~/Proyectos"
desc = "Go projects"

[[mgr.prepend_keymap]]
on = [ "g", "t" ]
run = "cd ~/.local/share/Trash/files"
desc = "Go trash"

[[mgr.prepend_keymap]]
on = "F"
run = "plugin smart-filter"
desc = "Smart filter"

[[mgr.prepend_keymap]]
on = "M"
run = "plugin mount"
desc = "Mount manager"

[[mgr.prepend_keymap]]
on = [ "c", "m" ]
run = "plugin chmod"
desc = "Change file mode"

[[mgr.prepend_keymap]]
on = [ "s", "n" ]
run = "sort natural --dir-first"
desc = "Sort naturally"

[[mgr.prepend_keymap]]
on = [ "s", "m" ]
run = "sort mtime --reverse --dir-first"
desc = "Sort by modified time"

[[mgr.prepend_keymap]]
on = [ "l", "s" ]
run = "linemode size"
desc = "Line mode: size"

[[mgr.prepend_keymap]]
on = [ "l", "m" ]
run = "linemode mtime"
desc = "Line mode: modified time"

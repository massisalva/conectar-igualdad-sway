#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [ 1, 4, 3 ]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 8

[preview]
wrap = "yes"
tab_size = 2
max_width = 1000
max_height = 1600
image_delay = 40
image_filter = "triangle"
image_quality = 70

[opener]
edit = [
  { run = "${EDITOR:-nvim} %s", desc = "$EDITOR", for = "unix", block = true },
]

open = [
  { run = "xdg-open %s1", desc = "Open", for = "linux", orphan = true },
]

play = [
  { run = "mpv %s", desc = "mpv", for = "unix", orphan = true },
]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { mime = "{audio,video}/*", use = "play" },
]

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

[[plugin.prepend_previewers]]
mime = "image/*"
run = "noop"

[[plugin.prepend_previewers]]
mime = "video/*"
run = "noop"

[[plugin.prepend_previewers]]
mime = "application/pdf"
run = "noop"

[[plugin.prepend_preloaders]]
mime = "image/*"
run = "noop"

[[plugin.prepend_preloaders]]
mime = "video/*"
run = "noop"

[[plugin.prepend_preloaders]]
mime = "application/pdf"
run = "noop"

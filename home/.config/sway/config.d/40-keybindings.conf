# ============================================================
# Keybindings - Sway / Conectar Igualdad
# ============================================================

# ------------------------------------------------------------
# Básicos
# ------------------------------------------------------------

bindsym $mod+Return exec $term --app-id foot-term
bindsym $mod+d exec $menu
bindsym $mod+q kill
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m '¿Salir de Sway?' -B 'Sí' 'swaymsg exit'


# ------------------------------------------------------------
# Aplicaciones rápidas
# ------------------------------------------------------------

bindsym $mod+b exec firefox
bindsym $mod+e exec foot --app-id foot-files -e yazi
bindsym $mod+p exec foot --app-id foot-system -e btop
bindsym $mod+m exec foot --app-id foot-music-ncmpcpp -e ncmpcpp
bindsym $mod+Shift+w exec ~/.local/bin/network-menu
bindsym $mod+Ctrl+a exec ~/.local/bin/audio-output-menu
bindsym $mod+Shift+v exec ~/.local/bin/clipboard-menu
bindsym $mod+F1 exec ~/.local/bin/shortcut-help

# Actualizar indicador de Bloq Mayús en Waybar inmediatamente al cambiar estado
bindsym --release --locked Caps_Lock exec pkill -RTMIN+8 waybar

# Notificaciones
bindsym $mod+n exec makoctl dismiss
bindsym $mod+Shift+n exec makoctl restore
bindsym $mod+Ctrl+n exec ~/.local/bin/notification-mode --toggle

# Saltar a la última ventana que solicita atención
bindsym $mod+u [urgent=latest] focus


# ------------------------------------------------------------
# Bloqueo y energía
# ------------------------------------------------------------

bindsym $mod+Ctrl+l exec ~/.local/bin/lock-screen
bindsym $mod+Shift+p exec ~/.local/bin/power-menu

# Activar o desactivar el touchpad
bindsym $mod+Ctrl+t input type:touchpad events toggle

# Alternar filtro de luz nocturna
bindsym $mod+Ctrl+s exec ~/.local/bin/nightlight-mode --toggle


# ------------------------------------------------------------
# Navegación entre ventanas
# ------------------------------------------------------------

bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right


# ------------------------------------------------------------
# Mover ventanas
# ------------------------------------------------------------

bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right

bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right


# ------------------------------------------------------------
# Workspaces
# ------------------------------------------------------------

workspace_auto_back_and_forth yes

bindsym $mod+1 workspace number 1:term
bindsym $mod+2 workspace number 2:web
bindsym $mod+3 workspace number 3:music
bindsym $mod+4 workspace number 4:files
bindsym $mod+5 workspace number 5:system
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

bindsym $mod+Shift+1 move container to workspace number 1:term
bindsym $mod+Shift+2 move container to workspace number 2:web
bindsym $mod+Shift+3 move container to workspace number 3:music
bindsym $mod+Shift+4 move container to workspace number 4:files
bindsym $mod+Shift+5 move container to workspace number 5:system
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# Mover la ventana a otro escritorio y seguirla
bindsym $mod+Ctrl+1 move container to workspace number 1:term; workspace number 1:term
bindsym $mod+Ctrl+2 move container to workspace number 2:web; workspace number 2:web
bindsym $mod+Ctrl+3 move container to workspace number 3:music; workspace number 3:music
bindsym $mod+Ctrl+4 move container to workspace number 4:files; workspace number 4:files
bindsym $mod+Ctrl+5 move container to workspace number 5:system; workspace number 5:system
bindsym $mod+Ctrl+6 move container to workspace number 6; workspace number 6
bindsym $mod+Ctrl+7 move container to workspace number 7; workspace number 7
bindsym $mod+Ctrl+8 move container to workspace number 8; workspace number 8
bindsym $mod+Ctrl+9 move container to workspace number 9; workspace number 9
bindsym $mod+Ctrl+0 move container to workspace number 10; workspace number 10

bindsym $mod+Tab workspace back_and_forth


# ------------------------------------------------------------
# Layout / mosaico
# ------------------------------------------------------------

# Dirección de apertura de la próxima ventana
bindsym $mod+v split v
bindsym $mod+Shift+b split h

# Layouts
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+t layout toggle split

# Pantalla completa
bindsym $mod+f fullscreen

# Foco de contenedores
bindsym $mod+a focus parent
bindsym $mod+Shift+a focus child


# ------------------------------------------------------------
# Ventanas flotantes
# ------------------------------------------------------------

bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+Shift+f move position center


# ------------------------------------------------------------
# Scratchpad
# ------------------------------------------------------------

bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show


# ------------------------------------------------------------
# Modo resize
# ------------------------------------------------------------

mode "resize" {
    bindsym h resize shrink width 10 px
    bindsym j resize grow height 10 px
    bindsym k resize shrink height 10 px
    bindsym l resize grow width 10 px

    bindsym Left resize shrink width 10 px
    bindsym Down resize grow height 10 px
    bindsym Up resize shrink height 10 px
    bindsym Right resize grow width 10 px

    bindsym Shift+h resize shrink width 30 px
    bindsym Shift+j resize grow height 30 px
    bindsym Shift+k resize shrink height 30 px
    bindsym Shift+l resize grow width 30 px

    bindsym Shift+Left resize shrink width 30 px
    bindsym Shift+Down resize grow height 30 px
    bindsym Shift+Up resize shrink height 30 px
    bindsym Shift+Right resize grow width 30 px

    bindsym Return mode "default"
    bindsym Escape mode "default"
}

bindsym $mod+r mode "resize"


# ------------------------------------------------------------
# Volumen
# ------------------------------------------------------------

bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume --limit 1.0 @DEFAULT_AUDIO_SINK@ 5%+ && notify-send -t 1000 -h string:x-canonical-private-synchronous:volume "󰕾 Volumen" "$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{printf "%d%%", $2*100}')"
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && notify-send -t 1000 -h string:x-canonical-private-synchronous:volume "󰖀 Volumen" "$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{printf "%d%%", $2*100}')"
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && notify-send -t 1000 -h string:x-canonical-private-synchronous:volume "󰝟 Volumen" "Silenciado"


# Micrófono y reproducción multimedia
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && notify-send -t 1000 -h string:x-canonical-private-synchronous:microphone "Micrófono" "Silenciado/activado"
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous


# ------------------------------------------------------------
# Brillo
# ------------------------------------------------------------

bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+ && notify-send -t 1000 -h string:x-canonical-private-synchronous:brightness "󰃠 Brillo" "$(brightnessctl -m | cut -d, -f4)"
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%- && notify-send -t 1000 -h string:x-canonical-private-synchronous:brightness "󰃞 Brillo" "$(brightnessctl -m | cut -d, -f4)"


# ------------------------------------------------------------
# Capturas de pantalla
# ------------------------------------------------------------

bindsym $mod+Shift+s exec ~/.local/bin/screenshot-menu
bindsym Print exec ~/.local/bin/screenshot-menu full
bindsym $mod+Print exec ~/.local/bin/screenshot-menu region
bindsym Shift+Print exec ~/.local/bin/screenshot-menu window
bindsym Ctrl+Print exec ~/.local/bin/screenshot-menu full-copy
bindsym $mod+Shift+Print exec ~/.local/bin/screenshot-menu region-copy

# Conservative SSH hardening for this single-user netbook.
# PasswordAuthentication stays enabled until key-based login is verified.
AllowUsers massisalva
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no

#!/usr/bin/nft -f

flush ruleset

table inet filter {
  set trusted_lan_ipv4 {
    type ipv4_addr
    flags interval
    elements = { 192.168.1.0/24 }
  }

  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop
    ct state established,related accept

    iifname "lo" accept

    ip protocol icmp accept
    ip6 nexthdr icmpv6 icmpv6 type {
      destination-unreachable,
      packet-too-big,
      time-exceeded,
      parameter-problem,
      echo-request,
      echo-reply,
      nd-router-solicit,
      nd-router-advert,
      nd-neighbor-solicit,
      nd-neighbor-advert
    } accept

    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept

    ip saddr @trusted_lan_ipv4 tcp dport 22 accept
    ip saddr @trusted_lan_ipv4 tcp dport 53317 accept
    ip saddr @trusted_lan_ipv4 udp dport 53317 accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}

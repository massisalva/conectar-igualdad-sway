# ============================================================
# Keybindings
# ============================================================

# Básicos
bindsym $mod+Return exec $term
bindsym $mod+d exec $menu
bindsym $mod+q kill
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m '¿Salir de Sway?' -B 'Sí' 'swaymsg exit'

# Aplicaciones rápidas
bindsym $mod+b exec firefox
bindsym $mod+e exec yazi
bindsym $mod+p exec foot -e btop
bindsym $mod+m exec foot --app-id foot-music -e ncmpcpp

# Bloqueo y energía
bindsym $mod+ctrl+l exec ~/.local/bin/lock-screen
bindsym $mod+Shift+p exec ~/.local/bin/power-menu

# Navegación entre ventanas
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Mover ventanas
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right

# Workspaces
workspace_auto_back_and_forth yes

bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4

# Layout
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+f fullscreen
bindsym $mod+Shift+space floating toggle
bindsym $mod+a focus parent

# Volumen
bindsym XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && notify-send -t 1000 -h string:x-canonical-private-synchronous:volume "󰕾 Volumen" "$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{printf "%d%%", $2*100}')"
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && notify-send -t 1000 -h string:x-canonical-private-synchronous:volume "󰖀 Volumen" "$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{printf "%d%%", $2*100}')"
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && notify-send -t 1000 -h string:x-canonical-private-synchronous:volume "󰝟 Volumen" "Silenciado"

# Brillo
bindsym XF86MonBrightnessUp exec brightnessctl set 5%+ && notify-send -t 1000 -h string:x-canonical-private-synchronous:brightness "󰃠 Brillo" "$(brightnessctl -m | cut -d, -f4)"
bindsym XF86MonBrightnessDown exec brightnessctl set 5%- && notify-send -t 1000 -h string:x-canonical-private-synchronous:brightness "󰃞 Brillo" "$(brightnessctl -m | cut -d, -f4)"

# Capturas de pantalla
bindsym $mod+Shift+s exec ~/.local/bin/screenshot-menu
bindsym Print exec ~/.local/bin/screenshot-menu full
bindsym $mod+Print exec ~/.local/bin/screenshot-menu region
bindsym Shift+Print exec ~/.local/bin/screenshot-menu window
bindsym Ctrl+Print exec ~/.local/bin/screenshot-menu full-copy
bindsym $mod+Shift+Print exec ~/.local/bin/screenshot-menu region-copy
